name: LottieDeveloper
options:
  bundleIdPrefix: com.nikapps.lottie
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: LWV5ZRPC43
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: 4.6.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  # Горячая перезагрузка вида в Debug (InjectionIII). В release — пустые заглушки.
  Inject:
    url: https://github.com/krzysztofzablocki/Inject
    from: "1.6.0"
targets:
  LottieDeveloper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UILaunchScreen:
          UIColorName: LaunchFallback
          UIImageName: LaunchBackground
          UIImageRespectsSafeAreaInsets: false
        NSLocalNetworkUsageDescription: Claude on your computer connects to this iPhone over Wi-Fi to build and check Lottie animations.
        NSBonjourServices: [_lottiedev._tcp]
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: true, NSAllowsLocalNetworking: true }
        UIFileSharingEnabled: true
        # Готовый Lottie (.json / .lottie) из Файлов или AirDrop открывается в приложении новым проектом.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Lottie animation
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, com.nikapps.lottie.dotlottie]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.nikapps.lottie.dotlottie
            UTTypeDescription: dotLottie animation
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification: { public.filename-extension: [lottie] }
        LSSupportsOpeningDocumentsInPlace: true
    # App Attest: посредник регистрирует только настоящее приложение. production — для TestFlight и App Store.
    entitlements:
      path: Sources/LottieDeveloper.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikapps.lottie.developer
        INFOPLIST_KEY_CFBundleDisplayName: Lottie Dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # InjectionIII: подмена функций в запущенном приложении и команды компиляции в логах.
        Debug:
          OTHER_LDFLAGS: ["-Xlinker", "-interposable"]
          EMIT_FRONTEND_COMMAND_LINES: "YES"
    sources:
      - path: Sources
        excludes:
          - Assets.xcassets
          - Info.plist
          - Resources
          - macOS
          - MCP
          - Companion
      - path: Sources/MCP
        excludes: [main.swift]
      - path: Sources/macOS/ProjectModels.swift
      - path: Sources/macOS/ProjectStore.swift
      - path: Sources/macOS/SVGToLottie.swift
      - path: Sources/Companion
        excludes: [Resources]
      - path: Sources/Companion/Resources/viewer
        type: folder
        buildPhase: resources
      - path: Sources/Assets.xcassets
        buildPhase: resources
      - path: Sources/Resources/en.lproj
        buildPhase: resources
      - path: Sources/Resources/ru.lproj
        buildPhase: resources
      - path: Sources/Resources/demo_animation.json
        buildPhase: resources
      - path: Sources/Resources/rocket_static_simplified.json
        buildPhase: resources
      - path: Sources/Store/LottieDeveloper.storekit
        buildPhase: resources
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Lottie
        product: Lottie
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: Inject
    scheme:
      gatherCoverageData: false
      testTargets:
        - LottieCompilerTests
  LottieDeveloperMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    info:
      path: Sources/macOS/Info.plist
      properties:
        CFBundleDisplayName: Lottie Dev
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikapps.lottie.developer.mac
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    sources:
      - path: Sources/AI/Spec
      - path: Sources/Shared
      - path: Sources/macOS
        excludes:
          - Info.plist
      - path: Sources/Resources/rocket_static_simplified.json
        buildPhase: resources
      - path: Sources/Resources/Workspace
        type: folder
        buildPhase: resources
      - path: .claude/skills/animate/SKILL.md
        buildPhase: resources
    dependencies:
      - package: Lottie
        product: Lottie
      - target: lottie-mcp
        embed: false
    postBuildScripts:
      - name: Embed lottie-mcp
        basedOnDependencyAnalysis: false
        script: |
          # MCP-сервер внутри приложения: дизайнеру не нужен Xcode, Claude запускает его из .app.
          set -e
          DST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/lottie-mcp"
          cp -f "$BUILT_PRODUCTS_DIR/lottie-mcp" "$DST"
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          [ -z "$IDENTITY" ] && IDENTITY="-"
          codesign --force --options runtime --timestamp=none --sign "$IDENTITY" "$DST"
    scheme:
      gatherCoverageData: false
  lottie-mcp:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        PRODUCT_NAME: lottie-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.nikapps.lottie.developer.mcp
        CODE_SIGN_STYLE: Automatic
    sources:
      - path: Sources/AI/Spec
      - path: Sources/MCP
      - path: Sources/Shared
      - path: Sources/macOS/ProjectModels.swift
      - path: Sources/macOS/ProjectStore.swift
      - path: Sources/macOS/SVGToLottie.swift
    dependencies:
      - package: Lottie
        product: Lottie
    scheme: {}
  LottieCompilerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests
    dependencies:
      - target: LottieDeveloperMac
    scheme:
      testTargets:
        - LottieCompilerTests
