name: LottieDeveloper
options:
  bundleIdPrefix: com.nikapps.lottie
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: LWV5ZRPC43
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: 4.6.0
targets:
  LottieDeveloper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchFallback
          UIImageName: LaunchBackground
          UIImageRespectsSafeAreaInsets: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikapps.lottie.developer
        INFOPLIST_KEY_CFBundleDisplayName: Lottie Dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    sources:
      - path: Sources
        excludes:
          - Assets.xcassets
          - Info.plist
          - Resources
          - macOS
      - path: Sources/Assets.xcassets
        buildPhase: resources
      - path: Sources/Resources/en.lproj
        buildPhase: resources
      - path: Sources/Resources/ru.lproj
        buildPhase: resources
      - path: Sources/Resources/demo_animation.json
        buildPhase: resources
      - path: Sources/Resources/rocket_static_simplified.json
        buildPhase: resources
      - path: Sources/Store/LottieDeveloper.storekit
        buildPhase: resources
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Lottie
        product: Lottie
    scheme:
      gatherCoverageData: false
      testTargets:
        - LottieCompilerTests
  LottieDeveloperMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    info:
      path: Sources/macOS/Info.plist
      properties:
        CFBundleDisplayName: Lottie Dev
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikapps.lottie.developer.mac
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
    sources:
      - path: Sources/AI/Spec
      - path: Sources/macOS
        excludes:
          - Info.plist
      - path: Sources/Resources/rocket_static_simplified.json
        buildPhase: resources
    dependencies:
      - package: Lottie
        product: Lottie
    scheme:
      gatherCoverageData: false
  LottieCompilerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests
    dependencies:
      - target: LottieDeveloperMac
    scheme:
      testTargets:
        - LottieCompilerTests
