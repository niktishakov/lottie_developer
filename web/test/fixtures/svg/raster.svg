<svg id="RasterDoc" xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <mask id="m"><rect x="130" y="20" width="80" height="80" fill="white"/><circle cx="170" cy="60" r="20" fill="black"/></mask>
    <radialGradient id="flat" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 160) scale(100 10)">
