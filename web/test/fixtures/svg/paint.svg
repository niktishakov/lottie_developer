<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="300" viewBox="0 0 300 300">
  <title>  Paint &amp; Gradients  </title>
  <defs>
    <linearGradient id="lg-obb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="50%" style="stop-color:#00ff00;stop-opacity:0.5"/>
      <stop offset="100%" stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="lg-user" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 20) rotate(30) scale(1.5)">
      <stop offset="0" stop-color="white" stop-opacity="0.2"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <linearGradient id="lg-href" xlink:href="#lg-obb" x1="1" x2="0"/>
    <radialGradient id="rg-round" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f80"/>
    </radialGradient>
    <radialGradient id="rg-user" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 220) scale(40)">
      <stop stop-color="yellow"/>
      <stop offset="1" stop-color="red" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="0" y="0" width="300" height="300"/></clipPath>
  </defs>
  <g id="grp" clip-path="url(#clip)">
    <rect x="10" y="10" width="100" height="60" fill="url(#lg-obb)" fill-opacity="0.8"/>
    <rect x="150" y="10" width="140" height="60" fill="url(#lg-user)"/>
    <rect x="10" y="100" width="100" height="60" fill="url(#lg-href)" stroke="url(#lg-user)" stroke-width="6"/>
    <g>
      <circle cx="200" cy="130" r="30" fill="url(#rg-round)" opacity="0.5"/>
    </g>
  </g>
  <circle id="ruser" cx="220" cy="220" r="40" fill="url(#rg-user)"/>
  <rect x="10" y="200" width="80" height="80" fill="#00f" fill-opacity="0.5" stroke="#f00" stroke-opacity="0.25" stroke-width="10"/>
  <rect x="100" y="200" width="60" height="60" style="fill:#0f0;opacity:0.6;stroke:#000;stroke-width:2"/>
</svg>
